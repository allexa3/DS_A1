server.port=${PORT:8080}

# --- Database (overridden by environment variables in Docker) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/device_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Inter-service communication (Docker network DNS name) ---
user.service.url=${USER_SERVICE_URL:http://localhost:8081}

# --- Swagger: paths live under /api/devices so the reverse proxy rule PathPrefix(/api/devices) covers them ---
springdoc.api-docs.path=/api/devices/v3/api-docs
springdoc.swagger-ui.path=/api/devices/swagger-ui.html

logging.level.root=INFO
logging.level.ro.tuc=DEBUG
