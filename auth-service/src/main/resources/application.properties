server.port=${PORT:8080}

# --- Credential database (overridden by environment variables in Docker) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT ---
# The secret must have at least 32 characters (HS256). Always override it in .env.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- Inter-service communication (Docker network DNS name) ---
user.service.url=${USER_SERVICE_URL:http://localhost:8081}

# --- Swagger: paths live under /api/auth so the reverse proxy rule PathPrefix(/api/auth) covers them ---
springdoc.api-docs.path=/api/auth/v3/api-docs
springdoc.swagger-ui.path=/api/auth/swagger-ui.html

logging.level.root=INFO
logging.level.ro.tuc=DEBUG
