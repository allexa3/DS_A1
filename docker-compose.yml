services:
  mysql-db:
    image: mysql:8.4
    container_name: mysql-db #optional - container_name commented out results in <project>-mysql-db-1, instead of db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306" #optional - if you want to connect from a db tool, if MYSQL is also installed directly, change the port to 3307 or any unused port
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - demo_net

  spring-demo:
    build: .
    container_name: spring-demo
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - demo_net


volumes:
  mysql-data:

networks:
  demo_net:
    name: demo_net
