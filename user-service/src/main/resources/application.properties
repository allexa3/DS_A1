server.port=${PORT:8080}

# --- Database (overridden by environment variables in Docker) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Inter-service communication (Docker network DNS name) ---
device.service.url=${DEVICE_SERVICE_URL:http://localhost:8082}

# --- Swagger: paths live under /api/users so the reverse proxy rule PathPrefix(/api/users) covers them ---
springdoc.api-docs.path=/api/users/v3/api-docs
springdoc.swagger-ui.path=/api/users/swagger-ui.html

logging.level.root=INFO
logging.level.ro.tuc=DEBUG
